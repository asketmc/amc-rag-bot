[tox]
envlist = py310,coverage
skipsdist = true

[testenv]
description = Run unit tests with coverage for {envname}
setenv =
    PYTHONPATH = {toxinidir}/src
    ASKMETC_TEST_STUBS = 1
    ASKMETC_TEST_DEBUG = 0
deps =
    pytest==9.0.2
    pytest-asyncio==1.3.0
    pytest-cov==5.0.0
    coverage[toml]==7.5.1
commands =
    python -m pytest --cov=asketmc_bot --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=html --cov-append

[testenv:coverage]
description = Combine and report coverage from all envs
deps =
    coverage[toml]==7.5.1
setenv =
    PYTHONPATH = {toxinidir}/src
commands =
    python -m coverage combine
    python -m coverage report -m
    python -m coverage xml -o coverage.xml
    python -m coverage html -d htmlcov
